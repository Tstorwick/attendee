# Builds the pinned Scribe fork image on every push to ihf/main.
# Consumed by the I-hate-fireflies deployment as ghcr.io/tstorwick/attendee:<tag>.
name: ihf-image

on:
  push:
    branches: [ihf/main]
    tags: ["v*-ihf.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tstorwick/attendee
          tags: |
            type=ref,event=tag
            type=raw,value=ihf-latest,enable=${{ github.ref == 'refs/heads/ihf/main' }}
            type=sha,prefix=ihf-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
